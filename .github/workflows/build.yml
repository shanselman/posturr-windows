name: Build Posturr

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore Posturr.csproj

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4
      with:
        versionSpec: '6.4.x'

    - name: GitVersion
      uses: gittools/actions/gitversion/execute@v4
      id: gitversion

    - name: Set version environment variables
      shell: pwsh
      run: |
        $version = '${{ steps.gitversion.outputs.semVer }}'
        $fullVersion = '${{ steps.gitversion.outputs.fullSemVer }}'
        $assemblyVersion = "${{ steps.gitversion.outputs.major }}.${{ steps.gitversion.outputs.minor }}.${{ steps.gitversion.outputs.patch }}.0"

        Write-Host "SemVer: $version"
        Write-Host "FullSemVer: $fullVersion"
        Write-Host "AssemblyVersion: $assemblyVersion"

        echo "VERSION=$version" >> $env:GITHUB_ENV
        echo "FULLVERSION=$fullVersion" >> $env:GITHUB_ENV
        echo "ASSEMBLY_VERSION=$assemblyVersion" >> $env:GITHUB_ENV

    - name: Build
      run: dotnet build Posturr.csproj -c Release --no-restore

    - name: Publish x64
      run: |
        dotnet publish Posturr.csproj `
          -c Release `
          -r win-x64 `
          /p:DebugType=None `
          /p:DebugSymbols=false `
          /p:Version=$env:VERSION `
          /p:AssemblyVersion=$env:ASSEMBLY_VERSION `
          /p:FileVersion=$env:ASSEMBLY_VERSION `
          /p:AssemblyInformationalVersion=$env:FULLVERSION `
          /p:PublishSingleFile=true `
          --self-contained

    - name: Sign executable with Trusted Signing
      if: startsWith(github.ref, 'refs/tags/')
      uses: azure/login@v2
      with:
        creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

    - name: Sign with Trusted Signing
      if: startsWith(github.ref, 'refs/tags/')
      uses: azure/trusted-signing-action@v1
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: https://wus2.codesigning.azure.net/
        trusted-signing-account-name: hanselman
        certificate-profile-name: WindowsEdgeLight
        files-folder: ${{ github.workspace }}\bin\Release\net10.0-windows10.0.19041.0\win-x64\publish
        files-folder-filter: exe
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256
          
    - name: Prepare artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path artifacts -Force
        $version = $env:VERSION
        
        # Create portable ZIP with exe and README
        New-Item -ItemType Directory -Path "temp-x64" -Force
        Copy-Item "bin/Release/net10.0-windows10.0.19041.0/win-x64/publish/Posturr.exe" -Destination "temp-x64/"
        Copy-Item "README.md" -Destination "temp-x64/"
        Compress-Archive -Path "temp-x64/*" -DestinationPath "artifacts/Posturr-win-x64.zip"
        
        Remove-Item "temp-x64" -Recurse -Force
                  
    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: Posturr-Windows
        path: artifacts/*

  create-release:
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download Windows artifacts
      uses: actions/download-artifact@v6
      with:
        name: Posturr-Windows
        path: artifacts/
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*
        generate_release_notes: true
        body: |
          ## Posturr for Windows ${{ github.ref_name }}
          
          A Windows port of [Posturr](https://github.com/tldev/posturr) - the posture monitoring app!
          
          🙏 **All credit to [Tom Lancaster](https://github.com/tldev), Cam, and Ben for the original concept!**
          
          ### 📦 Download
          
          | File | Description |
          |------|-------------|
          | `Posturr-win-x64.zip` | **Windows x64** - Extract and run `Posturr.exe` |
          
          **Self-contained** - No .NET installation required.
          
          ### 🪑 Usage
          1. Run Posturr - it appears in your system tray
          2. Right-click the tray icon and select "Calibrate"
          3. Look at each corner of your screen while sitting with good posture
          4. The app will dim your screen when you slouch!
          
          ### ⚙️ Settings
          - **Sensitivity** - How quickly the screen dims
          - **Dead Zone** - Movement tolerance before triggering
          - **Blur When Away** - Dim when no face detected
          
          ---
        append_body: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
